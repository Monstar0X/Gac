<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d1130" />
    <!-- Private playtest: keep it out of search results and link previews. -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <title>Waifu Gacha 3D — Luck Royale</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <canvas id="room-canvas"></canvas>
      <canvas id="game-canvas"></canvas>
      <div id="ui-root"></div>
    </div>

    <!-- Waifu Gacha 3D is a landscape-only game. Portrait shows this gate. -->
    <div id="rotate-gate">
      <div class="rotate-phone">
        <div class="rotate-body"></div>
        <div class="rotate-screen"></div>
      </div>
      <div class="rotate-title">ROTATE YOUR DEVICE</div>
      <div class="rotate-text">Waifu Gacha 3D plays in landscape. Turn your phone sideways to continue.</div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
